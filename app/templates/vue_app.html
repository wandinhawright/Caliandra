{% load static %}
{% load app_extras %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caliandra - App Vue</title>
    <link rel="icon" href="{% static 'app/img/ca3pia-de-lgcaliandra_v3-1---editado-YZ9j93rw22hp8GnK.avif' %}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Aldrich&family=Amethysta&family=Bad+Script&family=Aguafina+Script&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Vue App CSS will be injected by Vite -->
    {% if debug %}
        <!-- Development mode: Vite dev server -->
        <script type="module" src="http://localhost:5173/@vite/client"></script>
        <script type="module" src="http://localhost:5173/src/main.js"></script>
    {% else %}
        <!-- Production mode: Built assets -->
        {% vite_asset 'index.html' as vite_assets %}
        {% if vite_assets.css %}
            <link rel="stylesheet" href="{% static vite_assets.css %}">
        {% endif %}
    {% endif %}
</head>
<body style="background: #fffedf;">
    <div id="app"></div>
    
    <!-- CSRF Token for Django -->
    {% csrf_token %}
    <script>
        // Set CSRF token for Axios
        window.CSRF_TOKEN = '{{ csrf_token }}';
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% if not debug %}
        <!-- Production mode: Vue app -->
        {% if vite_assets.js %}
            <script type="module" src="{% static vite_assets.js %}"></script>
        {% endif %}
    {% endif %}
</body>
</html>
