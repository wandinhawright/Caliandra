
<!DOCTYPE html>
<html data-bs-theme="light" lang="en" style="background: var(--bs-danger);">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Untitled</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Aguafina+Script&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Aldrich&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alexandria&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Amethysta&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bad+Script&amp;display=swap">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Hero-Travel-.css">
    <link rel="stylesheet" href="assets/css/Navbar-Centered-Links-icons.css">
    <link rel="stylesheet" href="assets/css/text-box.css">
</head>

<body style="background: rgba(255,255,255,0);">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-md-6 col-xl-4">
                <div class="card mb-5" style="background: rgba(255,255,255,0);border-color: var(--bs-primary);">
                    <div class="card-body d-flex w-75 flex-column align-items-center ms-7 ps-0 pe-0 mt-10 pt-0 pb-0" style="background: var(--bs-secondary);border-color: var(--bs-warning);border-radius: 57px;">
                        <h2 class="mt-5" style="font-family: Amethysta, serif;color: rgb(0,0,0);">Log in</h2>
                        <p class="ms-0 me-0 mb-3" style="font-family: Amethysta, serif;">Faça login para poder fazer pedidos!</p>
                        <div class="bg-success my-4 bs-icon-xl bs-icon-circle bs-icon-primary bs-icon" style="background: var(--bs-warning);border-color: var(--bs-success);color: var(--bs-primary);"><svg class="bi bi-person" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664z"></path>
    </svg></div>
                        <form class="text-center" method="post">
                            <div class="mb-3"><input class="form-control w-75 ms-5 form-control" type="email" name="email" placeholder="E-mail" style="font-family: Amethysta, serif;border-color: var(--bs-success);"></div>
                            <div class="mb-3"><input class="form-control w-75 ms-5 form-control" type="password" name="password" placeholder="Senha" style="font-family: Amethysta, serif;border-color: var(--bs-success);"></div>
                            <div class="mb-3"><button class="btn btn-primary bg-success w-50" type="submit" style="border-color: var(--bs-success);border-radius: 36px;"><a style="font-size: 20px;font-family: Amethysta, serif;">Entrar</a></button></div>
                            <p class="text-muted mb-5" style="font-family: Amethysta, serif;">Ainda não possui um Login?&nbsp;<a href="{% url 'registro' %}">Registre-se Aqui!</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/bs-init.js"></script>
</body>

</html>
